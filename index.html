<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qutayba al Qaysi</title>
<meta name="description" content="Qutayba al Qaysi, Artist. Website in progress.">
<style>
  /* Template: 1440 x 900 px at 96 ppi. Every measurement below is in
     template pixels, multiplied by --u so the whole page keeps the
     template's proportions and fits the window. */
  :root { --u: min(100vw / 1440, 100vh / 900); }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    background: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
  }
  .stage {
    position: relative;
    width: calc(1440 * var(--u));
    height: calc(900 * var(--u));
    margin: 0 auto;
  }
  .name {
    position: absolute;
    left: calc(23 * var(--u));
    top: calc(44 * var(--u));
    margin: 0;
    font-size: calc(30 * var(--u));   /* 22.5 pt */
    font-weight: 100;                 /* UltraLight */
    letter-spacing: 0.1em;            /* tracking 100 */
    line-height: 1;
    color: #000;
    white-space: nowrap;
  }
  .work {
    position: absolute;
    left: calc(320 * var(--u));
    top: calc(132 * var(--u));
    width: calc(800 * var(--u));
    height: auto;
  }
  .status {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(808 * var(--u));
    margin: 0;
    text-align: center;
    font-size: calc(30 * var(--u));   /* 22.5 pt */
    font-weight: 100;                 /* UltraLight */
    letter-spacing: 0.05em;
    line-height: 1;
    color: #5b5b5b;
  }
  /* Phones: stacked layout */
  @media (max-width: 700px) {
    .stage { width: auto; height: auto; padding: 24px 16px 40px; box-sizing: border-box; }
    .name, .work, .status { position: static; }
    .name { font-size: 20px; }
    .work { display: block; width: 100%; margin: 56px 0 0; }
    .status { margin-top: 28px; font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <h1 class="name">QUTAYBA al QAYSI</h1>
    <img class="work" src="images/201025_003b.jpg" alt="Painting by Qutayba al Qaysi" width="600" height="476">
    <p class="status">website in progress</p>
  </div>
</body>
</html>
