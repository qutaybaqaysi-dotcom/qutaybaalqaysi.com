<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qutayba al Qaysi</title>
<meta name="description" content="Qutayba al Qaysi, Artist. Website in progress.">
<style>
  /* Designed on a 1440 x 900 canvas */
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff;
    color: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  header {
    position: absolute;
    top: 45px;
    left: 21px;
  }
  .name {
    margin: 0;
    font-size: 31px;
    font-weight: 100;
    letter-spacing: 0.1em;
    line-height: 1;
  }
  main {
    min-height: 100%;
    box-sizing: border-box;
    padding: 153px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .work {
    display: block;
    width: min(51.9vw, calc((100vh - 306px) * 1.259));
    height: auto;
  }
  .status {
    margin: 64px 0 0;
    font-size: 31px;
    font-weight: 300;
    line-height: 1;
    color: #666;
  }
  @media (max-width: 700px) {
    header { top: 24px; left: 16px; }
    .name { font-size: 20px; }
    main { padding-top: 96px; }
    .work { width: 90vw; }
    .status { margin-top: 32px; font-size: 18px; }
  }
</style>
</head>
<body>
  <header>
    <h1 class="name">QUTAYBA al QAYSI</h1>
  </header>
  <main>
    <img class="work" src="images/201025_003b.jpg" alt="Painting by Qutayba al Qaysi" width="600" height="476">
    <p class="status">website in progress</p>
  </main>
</body>
</html>
