<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qutayba al Qaysi</title>
<meta name="description" content="Qutayba al Qaysi, Artist. Website in progress.">
<style>
  /* Template: 1168 x 680 px at 96 ppi (Safari on Qutayba's MacBook).
     Rules: margins and type are fixed; only the painting resizes,
     filling the space between the name and the status line. */
  html, body { margin: 0; }
  body {
    background: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
  }
  .name {
    position: absolute;
    left: 24px;                       /* 0.25 in margin */
    top: 24px;                        /* 0.25 in margin */
    margin: 0;
    font-size: 25px;
    font-weight: 100;                 /* UltraLight */
    letter-spacing: 0.1em;            /* tracking 100 */
    line-height: 1;
    color: #000;
    white-space: nowrap;
  }
  .main {
    padding-top: 79px;
    text-align: center;
  }
  .work {
    display: block;
    margin: 0 auto;
    /* 521 px tall at a 680 px high window; grows and shrinks with the window */
    width: min(calc(100vw - 96px), calc((100vh - 159px) * 2400 / 1902));
    min-width: 280px;
    height: auto;
  }
  .piece {
    position: relative;
    display: table;                   /* shrinks to the painting's width */
    margin: 0 auto;
  }
  .info {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    padding: 2px 4px;
    border: 0;
    background: none;
    font: italic 300 15px "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #8a8a8a;
    cursor: pointer;
  }
  .info:hover, .info[aria-expanded="true"] { color: #000; }
  .caption {
    margin: 22px 0 0;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    color: #333;
  }
  .caption[hidden] { display: none; }
  .status {
    margin: 30px 0 0;
    font-size: 24.5px;
    font-weight: 100;                 /* UltraLight */
    letter-spacing: 0.06em;
    line-height: 1;
    color: #5b5b5b;
  }
  /* Phones: stacked layout */
  @media (max-width: 700px) {
    .name { position: static; padding: 24px 16px 0; font-size: 20px; }
    .main { padding: 56px 16px 40px; }
    .work { width: 100%; min-width: 0; }
    .piece { display: block; }
    .status { margin-top: 28px; font-size: 18px; }
  }
</style>
</head>
<body>
  <h1 class="name">QUTAYBA al QAYSI</h1>
  <div class="main">
    <figure class="piece">
      <img class="work" src="images/2020-10-25_048.jpg" alt="Tracing No. 7, 2020, oil and charcoal on vellum, by Qutayba al Qaysi" width="2400" height="1902">
      <button class="info" type="button" aria-expanded="false" aria-controls="caption" title="About this work">i</button>
    </figure>
    <p class="caption" id="caption" hidden>
      <i>Tracing No. 7</i><br>
      2020<br>
      Oil and charcoal on vellum<br>
      60 x 48 in. (152.4 x 121.92 cm)
    </p>
    <p class="status">website in progress</p>
  </div>
  <script>
    var b = document.querySelector('.info'), c = document.getElementById('caption');
    b.addEventListener('click', function () {
      c.hidden = !c.hidden;
      b.setAttribute('aria-expanded', String(!c.hidden));
    });
  </script>
</body>
</html>
