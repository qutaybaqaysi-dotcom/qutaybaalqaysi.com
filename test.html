<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qutayba al Qaysi (test)</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2b2b; }
  /* Text color is set per home image: black on light paintings, white on dark */
  :root { --ink: #000; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 100; }
  /* Painting fills the window; the crop keeps the chosen focal point */
  :root { --bar: 79px; }              /* white bar at the top holding the name and menu */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); background: #fff; z-index: 2; }
  .hero {
    position: fixed; top: var(--bar); left: 0;
    width: 100%; height: calc(100% - var(--bar));
    object-fit: cover;
    object-position: var(--focus, 40% 45%);
    cursor: zoom-in;
  }
  .name {
    position: fixed; top: 24px; right: 24px; margin: 0;
    font-size: 25px; font-weight: 200; letter-spacing: 0.1em; line-height: 1;
    color: var(--ink, #000);
    white-space: nowrap; z-index: 3;
  }
  .menu-btn {
    position: fixed; top: 24px; left: 24px; z-index: 5;
    border: 0; background: none; padding: 0; cursor: pointer;
    font: 200 16px/25px "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.1em; color: var(--ink, #000);
  }
  .menu {
    position: fixed; inset: 0; z-index: 4;
    background: rgba(255,255,255,0.97);
    display: flex; flex-direction: column; justify-content: center;
    padding-left: 24px;
  }
  .menu[hidden] { display: none; }
  .menu a {
    color: #000; text-decoration: none;
    font-size: 32px; font-weight: 100; letter-spacing: 0.08em; line-height: 1.6;
  }
  .menu a:hover { color: #777; }
  body.menu-open .menu-btn { color: #000; text-shadow: none; }
  .lb-caption {
    position: absolute; left: 24px; bottom: 24px; z-index: 2;
    margin: 0; color: #ccc; font-size: 12.5px; font-weight: 300; line-height: 1.3;
  }
  /* Lightbox: full screen, dark gray; + and - to zoom, drag to look around */
  .lb {
    position: fixed; inset: 0; z-index: 10;
    background: #2b2b2b;
    overflow: hidden;
    touch-action: none;
  }
  .lb[hidden] { display: none; }
  .lb img {
    position: absolute; left: 50%; top: 50%;
    max-width: calc(100vw - 96px); max-height: calc(100vh - 96px);
    transform-origin: 0 0;
    user-select: none; -webkit-user-drag: none;
    cursor: grab;
  }
  .lb img:active { cursor: grabbing; }
  .lb .ctl {
    position: absolute; right: 24px; bottom: 24px; z-index: 2;
    display: flex; gap: 8px;
  }
  .lb button {
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: rgba(43,43,43,0.7); color: #ddd;
    font: 300 22px/36px "Helvetica Neue", Helvetica, Arial, sans-serif;
    cursor: pointer; padding: 0;
  }
  .lb button:hover { background: rgba(80,80,80,0.9); color: #fff; }
  .lb .close { position: absolute; right: 24px; top: 24px; z-index: 2; }
  @media (max-width: 700px) {
    :root { --bar: 72px; }
    .name { font-size: 18px; top: 20px; right: 16px; }
    .menu-btn { top: 20px; left: 16px; font-size: 14px; line-height: 18px; }
  }
</style>
</head>
<body>
  <img class="hero work" src="images/2020-10-25_048.jpg" alt="Tracing No. 7, 2020, oil and charcoal on vellum, by Qutayba al Qaysi">
  <div class="bar"></div>
  <h1 class="name">QUTAYBA al QAYSI</h1>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">MENU</button>
  <nav class="menu" id="menu" hidden>
    <a href="#">Work</a>
    <a href="#">Bio</a>
    <a href="#">Contact</a>
  </nav>
  <script>
    var mb = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
    mb.addEventListener('click', function () {
      menu.hidden = !menu.hidden;
      document.body.classList.toggle('menu-open', !menu.hidden);
      mb.textContent = menu.hidden ? 'MENU' : 'CLOSE';
      mb.setAttribute('aria-expanded', String(!menu.hidden));
    });
  </script>
  <div class="lb" id="lb" hidden role="dialog" aria-label="Painting, full screen">
    <img id="lbimg" alt="">
    <button class="close" type="button" aria-label="Close">&times;</button>
    <p class="lb-caption"><i>Tracing No. 7</i><br>2020<br>Oil and charcoal on vellum<br>60 x 48 in. (152.4 x 121.92 cm)</p>
    <div class="ctl">
      <button class="out" type="button" aria-label="Zoom out">&minus;</button>
      <button class="fit" type="button" aria-label="Center and fit">&bull;</button>
      <button class="in" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>
  <script>
    (function () {
      var work = document.querySelector('.work'), lb = document.getElementById('lb'),
          img = document.getElementById('lbimg'), z = 1, x = 0, y = 0, drag = null;
      function draw() {
        img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')';
      }
      function center() {
        z = 1; x = -img.offsetWidth / 2; y = -img.offsetHeight / 2; draw();
      }
      function zoom(f, cx, cy) {
        var nz = Math.min(4, Math.max(1, z * f));
        if (cx === undefined) { cx = innerWidth / 2; cy = innerHeight / 2; }
        var ox = cx - innerWidth / 2, oy = cy - innerHeight / 2;
        x = ox - (ox - x) * nz / z; y = oy - (oy - y) * nz / z; z = nz;
        if (z === 1) { center(); } else { draw(); }
      }
      function open() {
        img.src = work.dataset.full || work.src; img.alt = work.alt;
        lb.hidden = false;
        if (img.complete) { center(); } else { img.onload = center; }
      }
      function close() { lb.hidden = true; }
      work.addEventListener('click', open);
      lb.querySelector('.close').addEventListener('click', close);
      lb.querySelector('.in').addEventListener('click', function () { zoom(1.5); });
      lb.querySelector('.out').addEventListener('click', function () { zoom(1 / 1.5); });
      lb.querySelector('.fit').addEventListener('click', center);
      img.addEventListener('dblclick', function (e) { zoom(z < 2 ? 2 : 1 / z, e.clientX, e.clientY); });
      lb.addEventListener('wheel', function (e) {
        e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
      }, { passive: false });
      img.addEventListener('pointerdown', function (e) {
        drag = { px: e.clientX, py: e.clientY, x: x, y: y }; img.setPointerCapture(e.pointerId);
      });
      img.addEventListener('pointermove', function (e) {
        if (!drag || z === 1) return;
        x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; draw();
      });
      img.addEventListener('pointerup', function () { drag = null; });
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      document.addEventListener('keydown', function (e) {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === '+' || e.key === '=') zoom(1.5);
        if (e.key === '-') zoom(1 / 1.5);
      });
    })();
  </script>
</body>
</html>
